# PIE Trader rule set. Every number here is checked before an order is sent (Guard)
# and replayed against your history (pie analyse).

[risk]
capital            = 200000   # trading capital, ₹
max_daily_loss     = 20000    # 10% hard floor for the day (spec §7 risk basis)
daily_profit_target = 20000   # 10% of capital — a MINIMUM, not a stop: after this,
                              # keep hunting at half size and protect the bank
after_target_risk_frac = 0.5  # risk per trade after the target (20k banked → 10k→ risk halved)
day_giveback_frac  = 0.5      # after target, stop if the day falls to half its peak
stop_after_first_loss = false # spec §7 supersedes: two losing trades end the day instead
max_weekly_loss    = 10000    # hit it → done until Monday
max_loss_per_trade = 10000    # 5% of capital per trade (spec §7)
stop_loss_pct      = 0.25     # stop at 25% of option premium
max_lots           = 10       # per position, including adds
min_lots           = 6        # spec §7: reject the trade if 6 lots can't fit the risk budget

[behaviour]
max_trades_per_day     = 3    # spec §7
max_orders_per_day     = 20
max_consecutive_losses = 2    # two losers in a row → stop
cooldown_minutes       = 15   # after any loss, same underlying
no_expiry_day_entries  = true # no new positions in a contract on its expiry day
no_averaging_down      = true

[session]
flat_by           = "15:15"   # short-dated options closed by this time
overnight_min_dte = 4         # only hold overnight with ≥4 days to expiry

[lot_sizes]
# FALLBACK ONLY — verify against pie_trader.auto.instruments.InstrumentMaster
# (refreshed from your broker's scrip master) before trading any of these.
NIFTY = 65
BANKNIFTY = 30
FINNIFTY = 60
MIDCPNIFTY = 120
SENSEX = 20
BANKEX = 30

[auto]                          # automated session engine (pie backtest / webhook)
underlying        = "NIFTY"
timeframe         = 5           # execution chart, minutes
htf               = 15          # bias chart, minutes
windows           = [["09:20","10:45"],["11:30","12:45"],["13:45","14:45"]]  # the three sessions
max_trades_per_window = 1     # one good trade per session
eod_exit          = "15:15"
setups            = ["sweep_bos","trend_bos","pdhl_break","ob_mitigation","or_fib"]
pd_filter         = true        # SMC: retracement longs only in discount, shorts only in premium
ote_filter        = false       # stricter 62–79% OTE pocket (research)
sma_filter        = false       # spec §4C: no mandatory SMA rules; keep as research toggle
stop_and_reverse  = true        # failed PDH/PDL breakout, strong opposite close → reverse armed
risk_per_trade    = 10000       # 5% of ₹2L at the stop; lots are sized from this (spec §7)
max_hold_days     = 3           # ride at most 3 sessions, entry day included
overnight_min_r   = 1.0         # hold overnight only if ≥1R ahead with stop at breakeven
min_rr_to_target  = 2.0         # take only trades with ≥1:2 room to the next liquidity
partial_at_r      = 1.0         # book half at +1R, stop to breakeven
partial_frac      = 0.5
trail             = "r_ratchet" # +1R→breakeven, +2R→lock +1R, +3R→lock +2R, …
allow_reverse_scalp = true      # profitable CHoCH exit → the flip may be traded the other way
min_premium       = 5           # Chart B gate: reject near-worthless contracts
max_premium_spread_pct = 0.08   # Chart B gate: modelled spread ceiling (replace with real quotes live)

# ── Multi-index (spec §1, §5) ──
# This [auto] block is ONE index's config. Each of NIFTY, BANKNIFTY, FINNIFTY,
# MIDCPNIFTY and SENSEX gets its own copy with independently tuned thresholds
# — do not assume the same stop distance or volatility threshold works across
# all five. `pie portfolio --indices NIFTY,BANKNIFTY,SENSEX` runs several at
# once sharing one PortfolioGuard: by default at most 1 position open across
# the whole portfolio, and never two positions in the same correlation group
# (all five are grouped together by default — they move together under most
# regimes). Raise --max-concurrent / pass --allow-correlated only with
# evidence that the indices you're opening together actually decouple.
