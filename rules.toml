# PIE Trader rule set. Every number here is checked before an order is sent (Guard)
# and replayed against your history (pie analyse).

[risk]
capital            = 200000   # trading capital, ₹
max_daily_loss     = 4000     # hit it → done for the day
daily_profit_target = 20000   # 10% of capital — a MINIMUM, not a stop: after this,
                              # keep hunting at half size and protect the bank
after_target_risk_frac = 0.5  # risk per trade after the target (20k banked → 10k→ risk halved)
day_giveback_frac  = 0.5      # after target, stop if the day falls to half its peak
stop_after_first_loss = true  # one booked loss → no more trades that day
max_weekly_loss    = 10000    # hit it → done until Monday
max_loss_per_trade = 1500     # entry × qty × stop_loss_pct must fit inside this
stop_loss_pct      = 0.25     # stop at 25% of option premium
max_lots           = 2        # per position, including adds
min_lots           = 1        # reject the trade if this can't fit the risk budget
                              # (spec §12 says 6 — that needs max_lots ≥ 6 and a bigger
                              # risk budget; raise both together, deliberately)

[behaviour]
max_trades_per_day     = 6    # new positions
max_orders_per_day     = 20
max_consecutive_losses = 2    # two losers in a row → stop
cooldown_minutes       = 15   # after any loss, same underlying
no_expiry_day_entries  = true # no new positions in a contract on its expiry day
no_averaging_down      = true

[session]
flat_by           = "15:15"   # short-dated options closed by this time
overnight_min_dte = 4         # only hold overnight with ≥4 days to expiry

[lot_sizes]
NIFTY = 65
BANKNIFTY = 30
SENSEX = 20

[auto]                          # automated session engine (pie backtest / webhook)
underlying        = "NIFTY"
timeframe         = 5           # execution chart, minutes
htf               = 15          # bias chart, minutes
windows           = [["09:20","10:45"],["11:30","12:45"],["13:45","14:45"]]  # the three sessions
max_trades_per_window = 1     # one good trade per session
eod_exit          = "15:15"
setups            = ["sweep_bos","trend_bos","pdhl_break"]
sma_filter        = true        # longs above / shorts below the 26-SMA only
stop_and_reverse  = true        # failed PDH/PDL breakout, strong opposite close → reverse armed
risk_per_trade    = 1500        # ₹ at the stop; lots are sized from this
max_hold_days     = 3           # ride at most 3 sessions, entry day included
overnight_min_r   = 1.0         # hold overnight only if ≥1R ahead with stop at breakeven
min_rr_to_target  = 2.0         # take only trades with ≥1:2 room to the next liquidity
partial_at_r      = 1.0         # book half at +1R, stop to breakeven
partial_frac      = 0.5
trail             = "r_ratchet" # +1R→breakeven, +2R→lock +1R, +3R→lock +2R, …
allow_reverse_scalp = true      # profitable CHoCH exit → the flip may be traded the other way
