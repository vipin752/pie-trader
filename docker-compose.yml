version: '3.8'

networks:
  pietrader-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  zookeeper-data:
  kafka-data:

services:

  # ── POSTGRESQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pietrader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - pietrader-net

  # ── REDIS ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pietrader-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - pietrader-net

  # ── ZOOKEEPER ─────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pietrader-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - pietrader-net

  # ── KAFKA ─────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pietrader-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - pietrader-net

  # ── KAFKA UI ──────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pietrader-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: pietrader-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    networks:
      - pietrader-net

  # ── PGADMIN ───────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pietrader-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - pietrader-net
    depends_on:
      - postgres

  # ── API GATEWAY (JAVA) ────────────────────
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pietrader-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      PYTHON_ANALYTICS_URL: http://python-analytics:8001
      ANGELONE_API_KEY: ${ANGELONE_API_KEY}
      ANGELONE_CLIENT_ID: ${ANGELONE_CLIENT_ID}
      ANGELONE_TOTP_SECRET: ${ANGELONE_TOTP_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - pietrader-net
    profiles:
      - app

  # ── PYTHON ANALYTICS ──────────────────────
  python-analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: pietrader-analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_ENV: local
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    networks:
      - pietrader-net
    profiles:
      - app

  # ── FRONTEND (Next.js) ────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pietrader-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"
    networks:
      - pietrader-net
    profiles:
      - app
      