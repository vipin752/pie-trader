[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pie-trader"
version = "0.1.0"
description = "Find the trading mistakes that cost you money, and enforce the rules that stop them."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.pytest.ini_options]
# Scope collection to this package's own tests. Without this, pytest's
# default discovery also walks analytics/tests/ (a separate Python
# component on this branch with its own requirements/live-network
# assumptions), which hangs rather than fails cleanly.
testpaths = ["tests"]

[project.scripts]
pie = "pie_trader.cli:main"

[tool.setuptools]
packages = ["pie_trader", "pie_trader.parsers"]
