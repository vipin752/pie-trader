# Common config for every profile. A profile MUST be chosen explicitly
# (SPRING_PROFILES_ACTIVE=dev|test|paper|prod) — there is no silent default,
# so nothing accidentally runs against the wrong database.
spring:
  application:
    name: pie-risk-engine
  jpa:
    hibernate:
      ddl-auto: validate   # schema changes go through Flyway migrations only, never auto-DDL
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true        # exposes /actuator/health/liveness and /readiness for Kubernetes
      show-details: when-authorized
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

server:
  shutdown: graceful          # spec Phase 2 "graceful shutdown"
spring.lifecycle.timeout-per-shutdown-phase: 20s

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
