# Automated test / CI profile. Real tests use Testcontainers and don't read
# this file for their datasource (they start their own Postgres/Redis) —
# this exists for anyone running the jar manually against the test compose
# stack, and for component tests that DO want fixed config.
spring:
  datasource:
    url: jdbc:postgresql://${PIE_DB_HOST:localhost}:5432/${PIE_DB_NAME:pie_trader_test}
    username: ${PIE_DB_USER:pie}
    password: ${PIE_DB_PASSWORD:pie_test_only}
  data:
    redis:
      host: ${PIE_REDIS_HOST:localhost}
      port: ${PIE_REDIS_PORT:6380}
pie:
  risk:
    capital: 200000
    max-daily-loss: 20000
    max-loss-per-trade: 10000
    max-lots: 10
    min-lots: 1          # looser than prod on purpose — exercises more code paths per test
    max-consecutive-losses: 2
    cooldown-minutes: 0
    no-expiry-day-entries: true
