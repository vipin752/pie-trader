# ═══════════════════════════════════════════════════════════════════════════════
# TRADING ENGINE CONFIG
# ═══════════════════════════════════════════════════════════════════════════════

# Mode: PAPER | MANUAL | SEMI_AUTO | AUTO
trading.mode=PAPER
trading.lot.size=75
trading.capital=200000

# ── Risk rules (contract §8) ──────────────────────────────────────────────────
trading.max.trades=3
trading.max.loss=2000
trading.max.loss.pct=5.0
trading.min.confidence=65
# Cooldown 30 min per contract §8
trading.cooldown.min=30

# ── Position sizing ───────────────────────────────────────────────────────────
trading.sizing.base.lots=1
trading.sizing.max.lots=3
trading.sizing.high.confidence=80
trading.sizing.very.high.confidence=90

# ── SL / Target fallback (% from entry) ──────────────────────────────────────
trading.sl.percent=30.0
trading.target.percent=60.0

# ── Exit engine ───────────────────────────────────────────────────────────────
trading.trailing.sl.activate.pct=20.0
trading.trailing.sl.lock.pct=10.0
trading.time.exit=15:10
trading.market.open=09:20
trading.market.close=15:20
