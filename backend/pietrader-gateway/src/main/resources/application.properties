#  PIE TRADER — application.properties (Production)
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=pietrader-gateway
server.port=8080

# ── DATABASE ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/pietrader
spring.datasource.username=pietrader
spring.datasource.password=pietrader@2024
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── REDIS ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=pietrader@2024
spring.data.redis.timeout=60000

# ── KAFKA ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=pietrader-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.admin.auto-create=true

# ── OBSERVABILITY ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── LOGGING ───────────────────────────────────────────────────────────────────
logging.level.org.springframework=INFO
logging.level.com.pietrader=DEBUG
logging.level.org.apache.kafka=WARN

# ── PYTHON ANALYTICS ─────────────────────────────────────────────────────────
PYTHON_ANALYTICS_URL=http://localhost:8000

