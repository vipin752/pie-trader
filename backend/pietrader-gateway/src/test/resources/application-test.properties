# Active via @ActiveProfiles("test")

# Angel broker disable startup runner (no TOTP prompt)
angel.startup.enabled=false

# Angel credentials (dummies satisfy @Value injection)
angel.api.key=TEST_KEY
angel.client.id=TEST_CLIENT
angel.password=TEST_PASS
angel.totp.secret=TEST_TOTP
angel.base.url=https://apiconnect.angelbroking.com
angel.client.local.ip=127.0.0.1
angel.client.public.ip=127.0.0.1
angel.mac.address=AA:BB:CC:DD:EE:FF

# H2 in-memory DB no Postgres needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis keep config but tests mock StringRedisTemplate directly
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka no real broker needed (tests mock KafkaTemplate)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.auto-offset-reset=earliest

# Trading config
trading.mode=PAPER
trading.lot.size=75
trading.max.trades=5
trading.max.loss=2000
trading.min.confidence=65
trading.cooldown.min=5

# Logging
logging.level.com.pietrader=WARN
logging.level.org.springframework=WARN
logging.level.org.apache.kafka=ERROR
